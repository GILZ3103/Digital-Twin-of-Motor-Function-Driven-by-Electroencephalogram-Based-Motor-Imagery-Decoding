  - url: https://github.com/DephyInc/Actuator-Package
    name: DephyInc/Actuator-Package
    module: M4
    phase: 4
    rig_fit: "Requires Dephy's own actuator boards (own MCU, RS-485/USB host API) — NOT ESP32-native. Would replace the ESP32 inner loop, not run alongside it."
    verdict: read
    extract: "FlexSEA electronics-architecture reference: 8A/25A motor driver + safety co-processor + strain-gauge amplifier + IMU on one board, all feeding a Python host API. Reference for how a real production SEA integrates strain-gauge effort sensing — not adoptable as code since it assumes Dephy hardware."
    liveness: "active; 946 commits on develop"
    license: MIT
    stars: null
    failure_yield: "Whole ecosystem (actuator + controller + strain amp) is one vertically-integrated Dephy product — cannot mix-and-match with a generic ESP32 + gimbal-motor build."
    last_checked: 2026-07-28

  - url: https://github.com/COMANDLab/SEA_Exoskeleton
    name: COMANDLab/SEA_Exoskeleton (OpenSEA)
    module: M4
    phase: 4
    rig_fit: "Arduino Uno + PlatformIO, brushed DC gearmotor — portable to ESP32 but as-published is a different MCU/motor class (elbow-scale, 4.12 Nm stall, 26 RPM)."
    verdict: read
    extract: "Open 3D-printed planetary-gear SEA BOM + PID firmware, ±2.109 Nm spring range. Useful as a cost/BOM template for a finger-scale SEA IF the effort-sensing decision favours SEA — but repo is thin (12 commits, 0 stars) and the README excerpt only confirms one encoder 'integrated with the motor'; a true SEA needs a second encoder on the spring/output side for deflection-based torque sensing — verify this exists before vendoring."
    liveness: "new; published Feb 2025, 12 commits, 0 stars"
    license: "unclear — not stated in fetched content, verify before any thesis reuse"
    stars: 0
    failure_yield: "No control-loop bandwidth reported in the paper — cannot confirm this design clears the ~30 Hz SEA bandwidth ceiling seen elsewhere without independent testing."
    last_checked: 2026-07-28

  - url: https://github.com/ITregear/SeriesElasticActuation-FYP
    name: ITregear/SeriesElasticActuation-FYP
    module: M4
    phase: 4
    rig_fit: "Two Arduino Unos + RMD X8 V2 BLDC + magnetic encoder + custom torsional spring — not ESP32/Jetson, but architecture (motor-side + output-side encoder) ports directly."
    verdict: read
    extract: "Solo-FYP-scale SEA build with a measured bandwidth number: 10.32 Hz open-loop -> 30.32 Hz closed-loop (2.93x). This is the reference figure for 'how much bandwidth does a spring cost you' when sizing the virtual-spring loop rate. Also reports SEA force accuracy beating an ATI Gamma reference transducer by 7.63% at ~£25 vs a lab-grade load cell."
    liveness: "unclear — Master's project snapshot, no date visible; no explicit license, 'may be used freely' per README"
    license: "unstated — treat as all-rights-reserved for thesis-publication purposes until confirmed"
    stars: null
    failure_yield: "SEA closed-loop bandwidth ceiling ~30 Hz even in a dedicated build — budget this against the virtual-spring loop-rate requirement before committing to SEA."
    last_checked: 2026-07-28

  - url: https://github.com/newdexterity/Hybrid-Exoskeleton-Glove
    name: newdexterity/Hybrid-Exoskeleton-Glove
    module: M4
    phase: 4
    rig_fit: "Standalone Robotis OpenCM9.04 MCU (ARM, Arduino-toolchain compatible) + Bluetooth — not ROS-dependent, ports conceptually to ESP32."
    verdict: read
    extract: "Tendon-driven finger actuation using 5x Dynamixel XM430-W350-T pulling UHMWPE braided tendon rated to 500 N, plus a pneumatic layer for abduction/thumb. Useful for tendon-routing and pretension geometry, not for the actuator-route decision itself (still uses geared Dynamixel current mode, same fidelity caveat as Route 1)."
    liveness: "60 commits, 0 stars visible; date unclear"
    license: CC-BY-4.0
    stars: 0
    failure_yield: ""
    last_checked: 2026-07-28

  - url: https://github.com/ROBOTIS-GIT/dynamixel-workbench
    name: ROBOTIS-GIT/dynamixel-workbench
    module: M4
    phase: 4
    rig_fit: "ROS-oriented wrapper around DynamixelSDK — read for the issue trail only, prefer raw DynamixelSDK for a non-ROS ESP32/Jetson rig."
    verdict: read
    extract: "Issue trail only — no code to take. Confirms the current-mode fidelity problem from a second, independent codebase/user base."
    liveness: "active"
    license: Apache-2.0
    stars: null
    failure_yield: "Issue #182: current-based POSITION control (not pure current mode) reportedly let torque exceed Goal_Current, unresolved upstream — do not trust Dynamixel-side current limits as a safety clamp in any mode. Issue #334/#351: present-current readings reported as implausibly high in current-control mode on OpenManipulator-X hardware — cross-check present_current against an independent sensor before trusting it for effort estimation."
    last_checked: 2026-07-28

